<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kolkata Vice City</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #game-ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: white;
            z-index: 10;
        }

        #game-title {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 2px 2px 6px #000;
        }

        #money {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 6px #000;
        }

        #controls {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 14px;
            line-height: 1.6;
            text-shadow: 2px 2px 5px #000;
        }
    </style>
</head>

<body>

    <div id="game-ui">
        <div id="game-title">KOLKATA VICE CITY</div>
        <div id="money">₹ 0</div>

        <div id="controls">
            WASD — Move<br>
            SHIFT — Run
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
